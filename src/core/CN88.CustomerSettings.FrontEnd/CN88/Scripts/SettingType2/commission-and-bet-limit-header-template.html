<div class="block__lbl"></div>
<div class="block__lbl-group w80-percent">
    <div class="block__lbl-sub-group"
         data-ng-class="{ 'w30-percent': isMobileView, 'w50-percent': !isMobileView }"
         data-ng-if="customerLevel !== avaiCustomerLevels.member">
        <div class="block__lbl"
             data-ng-if="!isMobileView"
             data-ng-style="eachGroupStyle"
             data-ng-repeat="item in availableCommissionGroups">{{item}}</div>
        <div class="block__lbl w100-percent" data-ng-if="isMobileView">{{::('Commission' | st2Label)}}</div>
    </div>
    <div class="block__lbl-sub-group block__lbl"
         data-ng-class="{ 'w30-percent': isMobileView, 'w50-percent': !isMobileView }"
         data-ng-if="customerLevel === avaiCustomerLevels.member">{{::('MemberCommission' | st2Label)}}</div>
    <div class="block__lbl-sub-group"
         data-ng-class="{ 'w70-percent': isMobileView, 'w50-percent': !isMobileView }">
        <div class="block__lbl w50-percent">
            <span>{{::('MaxPerEvent' | st2Label)}}</span>
            <span class="icon icon--command icon--info icon--margin-left"
                  data-tooltip="{{'MaxPerEventNote' | st2Message}}"
                  data-tooltip-type="info"
                  data-inner-tooltip="info">
            </span>
        </div>
        <div class="block__lbl block__lbl--no-border w50-percent">
            <span>{{::('MaxBet' | st2Label)}}</span>
            <span class="icon icon--command icon--info icon--margin-left"
                  data-tooltip="{{'MaxBetNote' | st2Message}}"
                  data-tooltip-type="info"
                  data-inner-tooltip="true">
            </span>
        </div>
    </div>
</div>
