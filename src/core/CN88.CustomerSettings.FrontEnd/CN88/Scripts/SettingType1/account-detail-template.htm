<div class="setting-type-1">
    <div class="block {{avaiCustomerLevels[actorLevel]}}"
         data-ng-show="settingType"
         data-ng-class="{ 'block--error': !(settingType | validSettingType) }"
         data-setting-field-group="settingType.settingItems[0]"
         data-resource-service-name="st1ResourceService">
        <div class="block__header"
             data-setting-type="{{settingType.id}}"
             data-ng-class="{ 'block__header--error': !(settingType | validSettingType) }">
            {{settingTypeName}}
        </div>
        <div class="section" data-ng-if="settingType | validSettingType">
            <st1-general-data data-account-detail="settingType.settingItems[0]"
                              data-is-editable="isEditable"></st1-general-data>
        </div>
        <div class="section section--last" data-ng-if="settingType | validSettingType">
            <st1-customer-credit data-account-detail="settingType.settingItems[0]"
                                 data-is-editable="isEditable"
                                 data-precision="settingType.creditPrecision"></st1-customer-credit>
            <st1-position-taking data-ng-if="isEditable && settingType.settingItems[0].ptItems.length > 0"
                                 data-account-detail="settingType.settingItems[0]"
                                 data-is-editable="isEditable"></st1-position-taking>
        </div>
        <div class="block__item block__item--error" data-ng-if="!(settingType | validSettingType)">
            {{settingType.settingItems[0].errorMessage}}
        </div>
    </div>
</div>
