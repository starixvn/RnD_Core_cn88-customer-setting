<div data-ng-repeat="ptItem in accountDetail.ptItems track by $index">
    <div class="position-taking__group-name position-taking--has-constraint">
        <span>{{ptItem.sportTypeName}}</span>
        <span class="position-taking__constraint-group">
            <span class="position-taking__constraint">{{'MinAllowed' | st1Label}} <span class="position-taking__constraint__value">{{ptItem.minAllowedPT | formatPercentage}}</span></span>
            <span class="position-taking__constraint">{{'MaxAllowed' | st1Label}} <span class="position-taking__constraint__value">{{ptItem.maxAllowedPT | formatPercentage}}</span></span>
        </span>
    </div>
    <div data-ng-if="isEditable && isNew">
        <div class="setting-field-group">
            <label class="setting-field-group__lbl">{{::('MasterPT' | st1Label)}}</label>
            <div class="setting-field-group__ctrl" data-ng-if="ptItem.minAllowedPT <= ptItem.maxAllowedPT">
                <percentage-dropdown class="setting-field--fullwidth"
                                     data-ng-model="ptItem.masterPT"
                                     data-min="0"
                                     data-max="ptItem.maxMasterPT"
                                     data-step="accountDetail.intervalValue"
                                     data-setting-field="{{'ptItems-' + $index + '-masterPT'}}"></percentage-dropdown>
            </div>
            <div class="setting-field-group__ctrl" data-ng-if="ptItem.minAllowedPT > ptItem.maxAllowedPT">
                <select class="setting-field setting-field--fullwidth"
                        data-setting-field="{{'ptItems-' + $index + '-masterPT'}}">
                    <option>-</option>
                </select>
            </div>
        </div>
        <div class="setting-field-group">
            <label class="setting-field-group__lbl">{{::('AgentPT' | st1Label)}}</label>
            <div class="setting-field-group__ctrl" data-ng-if="ptItem.minAllowedPT <= ptItem.maxAllowedPT">
                <percentage-dropdown class="setting-field--fullwidth"
                                     data-ng-model="ptItem.agentPT"
                                     data-min="0"
                                     data-max="ptItem.maxAgentPT"
                                     data-step="accountDetail.intervalValue"
                                     data-setting-field="{{'ptItems-' + $index + '-agentPT'}}"></percentage-dropdown>
            </div>
            <div class="setting-field-group__ctrl" data-ng-if="ptItem.minAllowedPT > ptItem.maxAllowedPT">
                <select class="setting-field setting-field--fullwidth"
                        data-setting-field="{{'ptItems-' + $index + '-agentPT'}}">
                    <option>-</option>
                </select>
            </div>
        </div>
    </div>
    <div data-ng-if="isEditable && !isNew">
        <div class="setting-field-group">
            <label class="setting-field-group__lbl">{{::('MasterPT' | st1Label)}}</label>
            <div class="setting-field-group__ctrl horizontal-stretch">
                <label class="w50-percent">{{ptItem.currentMasterPT | formatPercentage}}</label>
                <label class="w50-percent" data-ng-if="accountDetail.isPTReadOnly">-</label>
                <div class="w50-percent" data-ng-if="!accountDetail.isPTReadOnly">
                    <percentage-dropdown class="setting-field--fullwidth"
                                         data-ng-model="ptItem.masterPT"
                                         data-min="0"
                                         data-max="ptItem.maxMasterPT"
                                         data-step="accountDetail.intervalValue"
                                         data-setting-field="{{'ptItems-' + $index + '-masterPT'}}"></percentage-dropdown>
                </div>
            </div>
        </div>
        <div class="setting-field-group">
            <label class="setting-field-group__lbl">{{::('AgentPT' | st1Label)}}</label>
            <div class="setting-field-group__ctrl horizontal-stretch">
                <label class="w50-percent">{{ptItem.currentAgentPT | formatPercentage}}</label>
                <label class="w50-percent" data-ng-if="accountDetail.isPTReadOnly">-</label>
                <div class="w50-percent" data-ng-if="!accountDetail.isPTReadOnly">
                    <percentage-dropdown class="setting-field--fullwidth"
                                         data-ng-model="ptItem.agentPT"
                                         data-min="0"
                                         data-max="ptItem.maxAgentPT"
                                         data-step="accountDetail.intervalValue"
                                         data-setting-field="{{'ptItems-' + $index + '-agentPT'}}"></percentage-dropdown>
                </div>
            </div>
        </div>
    </div>
    <div data-ng-if="!isEditable">
        <div class="setting-field-group">
            <label class="setting-field-group__lbl">{{::('MasterPT' | st1Label)}}</label>
            <div class="setting-field-group__ctrl horizontal-stretch">
                <label class="w50-percent">{{ptItem.masterPT | formatPercentage}}</label>
                <label class="w50-percent">-</label>
            </div>
        </div>
        <div class="setting-field-group">
            <label class="setting-field-group__lbl">{{::('AgentPT' | st1Label)}}</label>
            <div class="setting-field-group__ctrl horizontal-stretch">
                <label class="w50-percent">{{ptItem.agentPT | formatPercentage}}</label>
                <label class="w50-percent">-</label>
            </div>
        </div>
    </div>
</div>
