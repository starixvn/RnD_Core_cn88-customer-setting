<div class="position-taking" data-ng-class="{ 'position-taking--edit': !isNew && !accountDetail.isPTReadOnly }">
    <div class="sub-header">{{::('PositionTaking' | st1Label)}}</div>
    <div class="msg msg--error" data-ng-if="isEditable && !isNew && !accountDetail.isPTReadOnly">
        <div class="icon msg__icon"></div>
        <div class="msg__content">{{'PTEffectiveTime' | st1Message:(accountDetail.ptEffectiveTime | formatDateTime)}}</div>
    </div>
    <st1-super-position-taking data-ng-if="customerLevel === avaiCustomerLevels.super"></st1-super-position-taking>
    <st1-master-position-taking data-ng-if="customerLevel === avaiCustomerLevels.master"></st1-master-position-taking>
    <st1-agent-position-taking data-ng-if="customerLevel === avaiCustomerLevels.agent"></st1-agent-position-taking>
</div>
