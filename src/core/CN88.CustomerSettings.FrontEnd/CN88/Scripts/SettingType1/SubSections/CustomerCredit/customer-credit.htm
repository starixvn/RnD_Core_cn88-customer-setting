<div class="customer-credit">
    <div class="sub-header">{{::('Credit' | settingType1Label)}}</div>
    <div data-ng-if="editable">
        <div data-ng-if="customerLevel === avaiCustomerLevels.super">
            <div class="row">
                <label class="w40-percent">
                    <span>{{::('Currency' | settingType1Label)}}</span>
                    <span class="required-field-mark" data-ng-if="isNew"> *</span>
                </label>
                <div class="w60-percent" data-ng-if="isNew">
                    <select class="setting-field setting-field--fullwidth"
                            data-ng-model="accountDetail.currency"
                            data-ng-options="currency.name for currency in accountDetail.currencies track by currency.id"
                            data-setting-field="currency"></select>
                </div>
                <label class="w60-percent" data-ng-if="!isNew">{{accountDetail.currency.name}}</label>
            </div>
            <div class="row">
                <label class="w40-percent">
                    <span>{{::('Credit' | settingType1Label)}}</span>
                    <span class="required-field-mark"> *</span>
                </label>
                <div class="w60-percent">
                    <input type="text"
                           maxlength="17"
                           class="setting-field setting-field--fullwidth setting-field--number"
                           data-numeric-input="creditPrecision"
                           data-strict-format="true"
                           data-ng-model="accountDetail.credit"
                           data-setting-field="credit" />
                </div>
            </div>
            <div class="row" data-ng-if="!isNew">
                <label class="w40-percent">{{::('AvailableCreditRange' | settingType1Label)}}</label>
                <label class="available-credit w60-percent">>= {{accountDetail.minCredit | number:creditPrecision}}</label>
            </div>
        </div>
        <div data-ng-if="customerLevel !== avaiCustomerLevels.super">
            <div class="row">
                <label class="w40-percent">
                    <span>{{::('Credit' | settingType1Label)}}</span>
                    <span class="required-field-mark"> *</span>
                </label>
                <div class="w60-percent">
                    <input type="text"
                           maxlength="17"
                           class="setting-field setting-field--fullwidth setting-field--number"
                           data-numeric-input="creditPrecision"
                           data-strict-format="true"
                           data-ng-model="accountDetail.credit"
                           data-setting-field="credit" />
                </div>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('AvailableCreditRange' | settingType1Label)}}</label>
                <label class="available-credit w60-percent">[{{accountDetail.minCredit | number:creditPrecision}}; {{accountDetail.maxCredit | number:creditPrecision}}]</label>
            </div>
        </div>
    </div>
    <div data-ng-if="!editable">
        <div data-ng-if="customerLevel === avaiCustomerLevels.super">
            <div class="row">
                <label class="w40-percent">{{::('Currency' | settingType1Label)}}</label>
                <label class="w60-percent">{{accountDetail.currency.name}}</label>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('Credit' | settingType1Label)}}</label>
                <label class="w60-percent">{{accountDetail.credit | number:creditPrecision}}</label>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('AvailableCreditRange' | settingType1Label)}}</label>
                <label class="w60-percent available-credit">>= {{accountDetail.minCredit | number:creditPrecision}}</label>
            </div>
        </div>
        <div data-ng-if="customerLevel !== avaiCustomerLevels.super">
            <div class="row">
                <label class="w40-percent">{{::('Credit' | settingType1Label)}}</label>
                <label class="w60-percent">{{accountDetail.credit | number:creditPrecision}}</label>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('AvailableCreditRange' | settingType1Label)}}</label>
                <label class="w60-percent available-credit">[{{accountDetail.minCredit | number:creditPrecision}}; {{accountDetail.maxCredit | number:creditPrecision}}]</label>
            </div>
        </div>
    </div>
</div>
