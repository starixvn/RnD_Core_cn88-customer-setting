<div class="customer-credit">
    <div class="sub-header">{{::('Credit' | settingType1Label)}}</div>
    <div data-ng-if="editable">
        <div data-ng-if="customerLevel === avaiCustomerLevels.super">
            <div class="row">
                <label class="w40-percent">
                    <span>{{::('Currency' | settingType1Label)}}</span>
                    <span class="required-field-mark" data-ng-if="isNew"> *</span>
                </label>
                <div class="setting-field-wrapper w60-percent"
                     data-ng-if="isNew"
                     data-tooltip
                     data-tooltip-message="{{accountDetail.validationState | tooltipMessage:'settingType1ResourceService':'currency'}}">
                    <select class="setting-field setting-field--fullwidth"
                            data-ng-model="accountDetail.currency"
                            data-ng-options="currency.name for currency in accountDetail.currencies track by currency.id"></select>
                </div>
                <label class="w60-percent" data-ng-if="!isNew">{{accountDetail.currency.name}}</label>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('Credit' | settingType1Label)}}</label>
                <div class="setting-field-wrapper w60-percent"
                     data-tooltip
                     data-tooltip-message="{{accountDetail.validationState | tooltipMessage:'settingType1ResourceService':'credit'}}">
                    <input type="text"
                           maxlength="14"
                           class="setting-field setting-field--fullwidth setting-field--number"
                           data-numeric-input="2"
                           data-ng-model="accountDetail.credit" />
                </div>
            </div>
        </div>
        <div data-ng-if="customerLevel !== avaiCustomerLevels.super">
            <div class="row">
                <label class="w40-percent">
                    <span>{{::('Credit' | settingType1Label)}}</span>
                    <span class="required-field-mark"> *</span>
                </label>
                <div class="setting-field-wrapper w60-percent"
                     data-tooltip
                     data-tooltip-message="{{accountDetail.validationState | tooltipMessage:'settingType1ResourceService':'credit'}}">
                    <input type="text"
                           maxlength="14"
                           class="setting-field setting-field--fullwidth setting-field--number"
                           data-numeric-input="2"
                           data-ng-model="accountDetail.credit" />
                </div>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('AvailableCredit' | settingType1Label)}}</label>
                <label class="available-credit w60-percent">{{accountDetail.availableCredit | formatNumber:2}}</label>
            </div>
        </div>
    </div>
    <div data-ng-if="!editable">
        <div data-ng-if="customerLevel === avaiCustomerLevels.super">
            <div class="row">
                <label class="w40-percent">{{::('Currency' | settingType1Label)}}</label>
                <label class="w60-percent">{{accountDetail.currency.name}}</label>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('Credit' | settingType1Label)}}</label>
                <label class="w60-percent">{{accountDetail.credit | formatNumber:2}}</label>
            </div>
        </div>
        <div data-ng-if="customerLevel !== avaiCustomerLevels.super">
            <div class="row">
                <label class="w40-percent">{{::('Credit' | settingType1Label)}}</label>
                <label class="w60-percent">{{accountDetail.credit | formatNumber:2}}</label>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('AvailableCredit' | settingType1Label)}}</label>
                <label class="w60-percent available-credit">{{accountDetail.availableCredit | formatNumber:2}}</label>
            </div>
        </div>
    </div>
</div>
