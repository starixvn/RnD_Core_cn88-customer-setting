<div class="customer-credit">
    <div class="sub-header">{{::('Credits' | st1Label)}}</div>
    <div data-ng-if="isEditable">
        <div data-ng-if="customerLevel === avaiCustomerLevels.super">
            <div class="setting-field-group">
                <label class="setting-field-group__lbl">{{::('Currency' | st1Label)}}</label>
                <label class="setting-field-group__ctrl">{{accountDetail.currency.name}}</label>
            </div>
            <div class="setting-field-group">
                <label class="setting-field-group__lbl">
                    <span>{{::('Credits' | st1Label)}}</span>
                    <span class="required-field-mark"> *</span>
                </label>
                <div class="setting-field-group__ctrl">
                    <input type="text"
                           maxlength="17"
                           class="setting-field setting-field--fullwidth setting-field--number"
                           data-numeric-input="creditPrecision"
                           data-strict-format="true"
                           data-ng-model="accountDetail.credit"
                           data-ng-disabled="!accountDetail.isAllowedUpdateCredit"
                           data-setting-field="credit" />
                </div>
            </div>
            <div class="setting-field-group available-credit-group" data-ng-if="!isNew">
                <label class="setting-field-group__lbl">{{::('AvailableCredits' | st1Label)}}</label>
                <label class="available-credit setting-field-group__ctrl">>= {{accountDetail.minCredit | number:creditPrecision}}</label>
            </div>
        </div>
        <div data-ng-if="customerLevel !== avaiCustomerLevels.super">
            <div class="setting-field-group">
                <label class="setting-field-group__lbl">
                    <span>{{::('Credits' | st1Label)}}</span>
                    <span class="required-field-mark"> *</span>
                </label>
                <div class="setting-field-group__ctrl">
                    <input type="text"
                           maxlength="17"
                           class="setting-field setting-field--fullwidth setting-field--number"
                           data-numeric-input="creditPrecision"
                           data-strict-format="true"
                           data-ng-model="accountDetail.credit"
                           data-ng-disabled="!accountDetail.isAllowedUpdateCredit"
                           data-setting-field="credit" />
                </div>
            </div>
            <div class="setting-field-group available-credit-group">
                <label class="setting-field-group__lbl">{{::('AvailableCredits' | st1Label)}}</label>
                <label class="available-credit setting-field-group__ctrl">{{accountDetail.maxCredit | number:creditPrecision}}</label>
            </div>
        </div>
    </div>
    <div data-ng-if="!isEditable">
        <div data-ng-if="customerLevel === avaiCustomerLevels.super">
            <div class="setting-field-group">
                <label class="setting-field-group__lbl">{{::('Currency' | st1Label)}}</label>
                <label class="setting-field-group__ctrl">{{accountDetail.currency.name}}</label>
            </div>
            <div class="setting-field-group">
                <label class="setting-field-group__lbl">{{::('Credits' | st1Label)}}</label>
                <label class="setting-field-group__ctrl">{{accountDetail.credit | number:creditPrecision}}</label>
            </div>
            <div class="setting-field-group">
                <label class="setting-field-group__lbl">{{::('CreditBalance' | st1Label)}}</label>
                <label class="setting-field-group__ctrl">{{accountDetail.creditBalance | number:creditPrecision}}</label>
            </div>
        </div>
        <div data-ng-if="customerLevel !== avaiCustomerLevels.super">
            <div class="setting-field-group">
                <label class="setting-field-group__lbl">{{::('Credits' | st1Label)}}</label>
                <label class="setting-field-group__ctrl">{{accountDetail.credit | number:creditPrecision}}</label>
            </div>
            <div class="setting-field-group">
                <label class="setting-field-group__lbl">{{::('CreditBalance' | st1Label)}}</label>
                <label class="setting-field-group__ctrl">{{accountDetail.creditBalance | number:creditPrecision}}</label>
            </div>
        </div>
    </div>
</div>
