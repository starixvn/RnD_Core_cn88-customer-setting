<div class="general-data">
    <div class="sub-header">{{::('GeneralData' | settingType1Label)}}</div>
    <div data-ng-if="editable">
        <div data-ng-if="customerLevel === avaiCustomerLevels.super">
            <div class="row">
                <label class="w40-percent">
                    <span>{{::('MainShareholder' | settingType1Label)}}</span>
                    <span class="required-field-mark" data-ng-if="isNew"> *</span>
                </label>
                <div class="dropdown-container w60-percent" data-ng-if="isNew">
                    <main-shareholder-suggestion class="setting-field setting-field--fullwidth"
                                                 data-ng-model="accountDetail.uplineUsername"
                                                 data-setting-field="uplineUsername" />
                </div>
                <label class="w60-percent" data-ng-if="!isNew">{{accountDetail.uplineUsername}}</label>
            </div>
            <div class="row">
                <label class="w40-percent">
                    <span>{{::('Username' | settingType1Label)}}</span>
                    <span class="required-field-mark" data-ng-if="isNew"> *</span>
                </label>
                <div class="w60-percent" data-ng-if="isNew">
                    <input type="text"
                           maxlength="30"
                           class="setting-field setting-field--fullwidth"
                           data-ng-model="accountDetail.username"
                           data-setting-field="username" />
                </div>
                <label class="w60-percent" data-ng-if="!isNew">{{accountDetail.username}}</label>
            </div>
            <div class="row" data-ng-if="isNew">
                <label class="w40-percent">
                    <span>{{::('Password' | settingType1Label)}}</span>
                    <span class="required-field-mark"> *</span>
                </label>
                <div class="w60-percent">
                    <input type="password"
                           maxlength="30"
                           class="setting-field setting-field--fullwidth"
                           data-ng-model="accountDetail.password"
                           data-setting-field="password" />
                </div>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('FirstName' | settingType1Label)}}</label>
                <div class="w60-percent">
                    <input type="text"
                           maxlength="50"
                           class="setting-field setting-field--fullwidth"
                           data-ng-model="accountDetail.firstName" />
                </div>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('LastName' | settingType1Label)}}</label>
                <div class="w60-percent">
                    <input type="text"
                           maxlength="50"
                           class="setting-field setting-field--fullwidth"
                           data-ng-model="accountDetail.lastName" />
                </div>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('Phone' | settingType1Label)}}</label>
                <div class="w60-percent">
                    <input type="text"
                           maxlength="50"
                           class="setting-field setting-field--fullwidth"
                           data-ng-model="accountDetail.phone" />
                </div>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('MobilePhone' | settingType1Label)}}</label>
                <div class="w60-percent">
                    <input type="text"
                           maxlength="50"
                           class="setting-field setting-field--fullwidth"
                           data-ng-model="accountDetail.mobilePhone" />
                </div>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('Fax' | settingType1Label)}}</label>
                <div class="w60-percent">
                    <input type="text"
                           maxlength="50"
                           class="setting-field setting-field--fullwidth"
                           data-ng-model="accountDetail.fax" />
                </div>
            </div>
        </div>
        <div data-ng-if="customerLevel === avaiCustomerLevels.master">
            <div class="row">
                <label class="w40-percent">
                    <span>{{::('Username' | settingType1Label)}}</span>
                    <span class="required-field-mark" data-ng-if="isNew"> *</span>
                </label>
                <div class="w60-percent" data-ng-if="isNew">
                    <span class="upline-username">{{accountDetail.uplineUsername}}</span>
                    <username-suffix-group></username-suffix-group>
                </div>
                <label class="w60-percent" data-ng-if="!isNew">{{accountDetail.username}}</label>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('Name' | settingType1Label)}}</label>
                <div class="w60-percent">
                    <input type="text"
                           maxlength="50"
                           class="setting-field setting-field--fullwidth"
                           data-ng-model="accountDetail.firstName" />
                </div>
            </div>
            <div class="row" data-ng-if="isNew">
                <label class="w40-percent">
                    <span>{{::('Password' | settingType1Label)}}</span>
                    <span class="required-field-mark"> *</span>
                    <span class="icon icon--command icon--info"
                          data-tooltip="{{'PasswordRules' | settingType1Message}}"
                          data-tooltip-type="warning"
                          data-inner-tooltip="true"></span>
                </label>
                <div class="w60-percent">
                    <input type="password"
                           maxlength="16"
                           class="setting-field setting-field--fullwidth"
                           data-ng-model="accountDetail.password"
                           data-setting-field="password" />
                </div>
            </div>
            <div class="row" data-ng-if="isNew">
                <label class="w40-percent">
                    <span>{{::('ConfirmPassword' | settingType1Label)}}</span>
                    <span class="required-field-mark"> *</span>
                </label>
                <div class="w60-percent">
                    <input type="password"
                           maxlength="16"
                           class="setting-field setting-field--fullwidth"
                           data-ng-model="accountDetail.confirmPassword"
                           data-setting-field="confirmPassword" />
                </div>
            </div>
        </div>
        <div data-ng-if="customerLevel === avaiCustomerLevels.agent">

                <label class="w40-percent">{{::('Master' | settingType1Label)}}</label>

            <div class="row">

                <label class="w60-percent" data-ng-if="!isNew">{{accountDetail.username}}</label>

            <div class="row">

                    <input type="text"

            </div>
            <div class="row" data-ng-if="isNew">
                <label class="w40-percent">
                    <span>{{::('Password' | settingType1Label)}}</span>
                    <span class="required-field-mark"> *</span>
                    <span class="icon icon--command icon--info"
                          data-tooltip="{{'PasswordRules' | settingType1Message}}"

                          data-inner-tooltip="true">
                    </span>
                </label>
                <div class="w60-percent">
                    <input type="password"

            </div>
            <div class="row" data-ng-if="isNew">
                <label class="w40-percent">
                    <span>{{::('ConfirmPassword' | settingType1Label)}}</span>
                    <span class="required-field-mark"> *</span>
                </label>
                <div class="w60-percent">
                    <input type="password"
                           maxlength="16"
                           class="setting-field setting-field--fullwidth"
                           data-ng-model="accountDetail.confirmPassword"
                           data-setting-field="confirmPassword" />
                </div>
            </div>
        </div>
        <div data-ng-if="customerLevel === avaiCustomerLevels.member">
            <div class="row" data-ng-if="isNew">
                <label class="w40-percent">{{::('Agent' | settingType1Label)}}</label>

            </div>
            <div class="row">
                <label class="w40-percent">

                    <span class="required-field-mark" data-ng-if="isNew"> *</span>

                    <username-suffix-group></username-suffix-group>
                </div>
                <label class="w60-percent" data-ng-if="!isNew">{{accountDetail.username}}</label>
            </div>
            <div class="row">
                <label class="w40-percent">
                    <span>{{::('SpreadGroup' | settingType1Label)}}</span>
                    <span class="required-field-mark" data-ng-if="isNew"> *</span>
                    <span class="icon icon--command icon--info"
                          data-tooltip="{{'SpreadGroupRule' | settingType1Message}}"
                          data-tooltip-type="warning"
                          data-inner-tooltip="true">
                    </span>
                </label>
                <div class="w60-percent" data-ng-if="isNew">
                    <select class="setting-field setting-field--fullwidth"
                            data-ng-model="accountDetail.spreadGroup"
                            data-ng-options="spreadGroup.uGroup for spreadGroup in accountDetail.spreadGroups track by spreadGroup.uGroup"
                            data-ng-change="updateSpreadGroup()"></select>
                </div>
                <label class="w60-percent" data-ng-if="!isNew">{{accountDetail.spreadGroup.uGroup}}</label>
            </div>
            <div class="row">
                <label class="w40-percent">{{::('Name' | settingType1Label)}}</label>
                <div class="w60-percent">
                    <input type="text"
                           maxlength="50"
                           class="setting-field setting-field--fullwidth"
                           data-ng-model="accountDetail.firstName" />
                </div>
            </div>
            <div class="row" data-ng-if="isNew">
                <label class="w40-percent">
                    <span>{{::('Password' | settingType1Label)}}</span>
                    <span class="required-field-mark"> *</span>
                    <span class="icon icon--command icon--info"
                          data-tooltip="{{'MemberPasswordRules' | settingType1Message}}"
                          data-tooltip-type="warning"
                          data-inner-tooltip="true">
                    </span>
                </label>
                <div class="w60-percent">
                    <input type="password"
                           maxlength="10"
                           class="setting-field setting-field--fullwidth"
                           data-ng-model="accountDetail.password"
                           data-setting-field="password" />

            <div class="row" data-ng-if="isNew">

            <div class="row">

            </div>
        </div>
