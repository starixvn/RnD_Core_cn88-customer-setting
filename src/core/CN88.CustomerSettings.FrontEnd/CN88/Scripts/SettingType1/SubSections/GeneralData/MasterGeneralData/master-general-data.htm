<div>
    <div data-ng-if="editable">
        <div class="row">
            <label class="w40-percent">
                <span>{{::('Username' | st1Label)}}</span>
                <span class="required-field-mark" data-ng-if="isNew"> *</span>
            </label>
            <div class="w60-percent" data-ng-if="isNew">
                <span class="upline-username">{{accountDetail.uplineUsername}}</span>
                <st1-username-suffix-group></st1-username-suffix-group>
            </div>
            <label class="w60-percent" data-ng-if="!isNew">{{accountDetail.username}}</label>
        </div>
        <div class="row">
            <label class="w40-percent">{{::('Name' | st1Label)}}</label>
            <div class="w60-percent">
                <input type="text"
                       maxlength="50"
                       class="setting-field setting-field--fullwidth"
                       data-ng-model="accountDetail.firstName" />
            </div>
        </div>
        <div class="row" data-ng-if="isNew">
            <label class="w40-percent">
                <span>{{::('Password' | st1Label)}}</span>
                <span class="required-field-mark"> *</span>
                <span class="icon icon--command icon--info"
                      data-tooltip="{{'PasswordRules' | st1Message}}"
                      data-tooltip-type="info"
                      data-inner-tooltip="true"></span>
            </label>
            <div class="w60-percent">
                <input type="password"
                       maxlength="16"
                       class="setting-field setting-field--fullwidth"
                       data-ng-model="accountDetail.password"
                       data-setting-field="password" />
            </div>
        </div>
        <div class="row" data-ng-if="isNew">
            <label class="w40-percent">
                <span>{{::('ConfirmPassword' | st1Label)}}</span>
                <span class="required-field-mark"> *</span>
            </label>
            <div class="w60-percent">
                <input type="password"
                       maxlength="16"
                       class="setting-field setting-field--fullwidth"
                       data-ng-model="accountDetail.confirmPassword"
                       data-setting-field="confirmPassword" />
            </div>
        </div>
    </div>
    <div data-ng-if="!editable">
        <div class="row">
            <label class="w40-percent">{{::('Username' | st1Label)}}</label>
            <label class="w60-percent">{{accountDetail.username}}</label>
        </div>
        <div class="row">
            <label class="w40-percent">{{::('Name' | st1Label)}}</label>
            <label class="w60-percent">{{accountDetail.firstName}}</label>
        </div>
    </div>
</div>
