<div>
    <div data-ng-if="isEditable">
        <div class="setting-field-group" data-ng-if="isNew">
            <label class="setting-field-group__lbl">{{::('Agent' | st1Label)}}</label>
            <label class="setting-field-group__ctrl">{{accountDetail.uplineUsername}}</label>
        </div>
        <div class="setting-field-group">
            <label class="setting-field-group__lbl">
                <span>{{::('Username' | st1Label)}}</span>
                <span class="required-field-mark" data-ng-if="isNew"> *</span>
            </label>
            <div class="setting-field-group__ctrl"
                 data-ng-class="{ 'horizontal-stretch': isMobileView }"
                 data-ng-if="isNew">
                <span class="upline-username">{{accountDetail.uplineUsername}}</span>
                <st1-username-suffix-group></st1-username-suffix-group>
            </div>
            <label class="setting-field-group__ctrl" data-ng-if="!isNew">{{accountDetail.username}}</label>
        </div>
        <div class="setting-field-group">
            <label class="setting-field-group__lbl">
                <span>{{::('SpreadGroup' | st1Label)}}</span>
                <span class="required-field-mark" data-ng-if="isNew"> *</span>
                <span class="icon icon--command icon--info"
                      data-tooltip="{{'SpreadGroupRule' | st1Message}}"
                      data-tooltip-type="info"
                      data-inner-tooltip="true">
                </span>
            </label>
            <div class="setting-field-group__ctrl" data-ng-if="isNew">
                <select class="setting-field setting-field--fullwidth"
                        data-ng-model="accountDetail.spreadGroup"
                        data-ng-options="spreadGroup.uGroup for spreadGroup in accountDetail.spreadGroups track by spreadGroup.uGroup"
                        data-ng-change="updateSpreadGroup()"></select>
            </div>
            <label class="setting-field-group__ctrl" data-ng-if="!isNew">{{accountDetail.spreadGroup.uGroup}}</label>
        </div>
        <div class="setting-field-group">
            <label class="setting-field-group__lbl">{{::('Name' | st1Label)}}</label>
            <div class="setting-field-group__ctrl">
                <input type="text"
                       maxlength="50"
                       class="setting-field setting-field--fullwidth"
                       data-ng-model="accountDetail.firstName" />
            </div>
        </div>
        <div class="setting-field-group" data-ng-if="isNew">
            <label class="setting-field-group__lbl">
                <span>{{::('Password' | st1Label)}}</span>
                <span class="required-field-mark"> *</span>
                <span class="icon icon--command icon--info"
                      data-tooltip="{{'PasswordRules' | st1Message}}"
                      data-tooltip-type="info"
                      data-inner-tooltip="true">
                </span>
            </label>
            <div class="setting-field-group__ctrl">
                <input type="password"
                       maxlength="12"
                       class="setting-field setting-field--fullwidth"
                       data-ng-model="accountDetail.password"
                       data-setting-field="password" />
            </div>
        </div>
        <div class="setting-field-group" data-ng-if="isNew">
            <label class="setting-field-group__lbl">
                <span>{{::('ConfirmPassword' | st1Label)}}</span>
                <span class="required-field-mark"> *</span>
            </label>
            <div class="setting-field-group__ctrl">
                <input type="password"
                       maxlength="12"
                       class="setting-field setting-field--fullwidth"
                       data-ng-model="accountDetail.confirmPassword"
                       data-setting-field="confirmPassword" />
            </div>
        </div>
    </div>
    <div data-ng-if="!isEditable">
        <div class="setting-field-group">
            <label class="setting-field-group__lbl">{{::('Username' | st1Label)}}</label>
            <label class="setting-field-group__ctrl">{{accountDetail.username}}</label>
        </div>
    </div>
</div>
