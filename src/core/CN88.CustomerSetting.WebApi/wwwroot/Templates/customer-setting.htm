<!DOCTYPE html><html data-ng-app="customerSetting" data-ng-controller="customerSettingController as ctrl" data-ng-class="{ 'mobile-view': ctrl.isMobileView }"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes"><title>{{ctrl.title}}</title><link rel="stylesheet" type="text/css" href="{{cdnUri}}/styles/customer-setting.min.css?v={{version}}"><link rel="stylesheet" type="text/css" href="{{customCss}}"></head><body data-ng-cloak><block-ui></block-ui><div class="system-{{ctrl.systemId}}"><div class="msg-container" data-ng-show="ctrl.warningMessages || ctrl.requestMsgResult"><setting-result data-result="ctrl.warningMessages"></setting-result><setting-result data-result="ctrl.requestMsgResult"></setting-result></div><div class="customer-setting customer-level-{{ctrl.setting.customerLevel}}" data-ng-show="ctrl.setting"><setting-type-loader data-setting="ctrl.setting" data-update="ctrl.update(settingTypeId)"></setting-type-loader><div class="btn-container" data-ng-if="(ctrl.setting | editableForm) || ctrl.cancelCallback"><button class="btn btn--cancel btn--margin-right" data-ng-if="ctrl.cancelCallback" data-ng-click="ctrl.cancelCallback()">{{'Cancel' | label}}</button> <button class="btn btn--update btn--margin-right" data-ng-if="ctrl.saveAndNewRequired && (ctrl.setting | editableForm)" data-ng-click="ctrl.saveAndNew()">{{'SaveAndNew' | label}}</button> <button class="btn btn--update" data-ng-if="ctrl.saveRequired && (ctrl.setting | editableForm)" data-ng-click="ctrl.update()">{{'Save' | label}}</button></div></div></div><script type="text/javascript">
        var appConfig = {{appConfig}};
        var params = {{params}};
    </script><script type="text/javascript" src="{{cdnUri}}/scripts/product-{{productId}}{{min}}.js?v={{version}}"></script></body></html>
